name: render

# Renders episode HTML files to MP4 on GitHub Cloud Runners.
# Trigger on-demand via Actions -> render -> Run workflow (default: BYTE-VRAM).

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Specific episode to render (e.g. BYTE-VRAM, BYTE-DUAL-GPU, or 'all')"
        required: false
        default: "BYTE-DUAL-GPU"
      res:
        description: "Target render resolution (1440p or 1080p)"
        required: false
        default: "1440p"
      fps:
        description: "frames per second"
        default: "30"
      max_parallel:
        description: "episodes rendered at once"
        default: "4"

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}-${{ github.event.inputs.episode || github.run_id }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      episodes: ${{ steps.ls.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ls
        env:
          INPUT_EPISODE: ${{ github.event.inputs.episode }}
        run: |
          EP="${INPUT_EPISODE:-BYTE-DUAL-GPU}"
          if [ "$EP" != "all" ]; then
            if ! echo "$EP" | grep -Eq '^[A-Za-z0-9_-]+$'; then
              echo "::error::Invalid episode input format: $EP"
              exit 1
            fi
            LIST="[\"$EP\"]"
          else
            LIST=$(ls episodes/*.html 2>/dev/null | xargs -r -n1 basename \
                   | sed 's/\.html$//' | jq -R -s -c 'split("\n")|map(select(length>0))')
          fi
          [ -z "$LIST" ] && LIST='[]'
          echo "list=$LIST" >> "$GITHUB_OUTPUT"
          echo "found: $LIST"

  render:
    needs: discover
    if: ${{ needs.discover.outputs.episodes != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(github.event.inputs.max_parallel || '4') }}
      matrix:
        episode: ${{ fromJson(needs.discover.outputs.episodes) }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright + Dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install playwright numpy pillow edge-tts -q
          python -m playwright install --with-deps chromium

      # gate: runs the 30-check FUSION gate or legacy static checks
      - name: Validate ${{ matrix.episode }}
        run: python -u scripts/check.py --only "${{ matrix.episode }}"

      - name: Render ${{ matrix.episode }}
        env:
          FPS: ${{ github.event.inputs.fps || '30' }}
          RES: ${{ github.event.inputs.res || '1440p' }}
          ONLY: ${{ matrix.episode }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$RES" != "1440p" && "$RES" != "1080p" ]]; then
            echo "::error::Invalid resolution $RES (must be 1440p or 1080p)"
            exit 1
          fi
          python -u scripts/render.py

      - name: Upload ${{ matrix.episode }} MP4
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.episode }}
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 30
