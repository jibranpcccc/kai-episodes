name: Byte Forensics Quality Gate & Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode to validate and package (e.g. BYTE-DUAL-GPU, BYTE-PAYBACK, BYTE-VRAM)"
        required: false
        default: "BYTE-DUAL-GPU"

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: 31-Check Quality Gate & Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install playwright numpy pillow edge-tts -q
          python -m playwright install --with-deps chromium

      - name: Determine Episode to Validate
        id: ep
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            EP="${{ github.event.inputs.episode }}"
          else
            # Detect changed episode from git diff HEAD~1
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD 2>/dev/null | grep -E '^(episodes/)?BYTE-[A-Za-z0-9_-]+\.html$' | head -1 | sed -E 's|^(episodes/)?||; s|\.html$||')
            if [ -n "$CHANGED" ]; then
              EP="$CHANGED"
            else
              EP="BYTE-DUAL-GPU"
            fi
          fi
          # Strict episode allowlist format validation
          if ! [[ "$EP" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Error: Invalid episode name format '$EP'" >&2
            exit 1
          fi
          echo "selected_episode=$EP" >> $GITHUB_OUTPUT
          echo "Selected episode: $EP"

      - name: Run Universal FUSION Quality Gate (fusion_gate.py)
        run: |
          EP="${{ steps.ep.outputs.selected_episode }}"
          echo "Running Quality Gate on $EP..."
          python -u data/fusion_gate.py "$EP"

      - name: Run Deep Episode Semantic & Fact-Check Auditor
        run: |
          EP="${{ steps.ep.outputs.selected_episode }}"
          echo "Running Deep Episode Auditor on $EP..."
          python -u data/deep_episode_auditor.py "$EP"

      - name: Generate Authoritative SHA-256 Release Manifest
        run: |
          EP="${{ steps.ep.outputs.selected_episode }}"
          python -c "
          import hashlib, json, os
          ep = '$EP'
          files = [f'episodes/{ep}.html', f'episodes/{ep}.srt', f'episodes/{ep}-chapters.txt', f'episodes/{ep}-scenes.txt']
          manifest = {
              'commit': os.environ.get('GITHUB_SHA', '${{ github.sha }}'),
              'episode': ep,
              'artifacts': {}
          }
          for f in files:
              if os.path.exists(f):
                  manifest['artifacts'][f] = hashlib.sha256(open(f, 'rb').read()).hexdigest()
          with open(f'episodes/{ep}-manifest.json', 'w', encoding='utf-8') as mf:
              json.dump(manifest, mf, indent=2)
          print('Generated authoritative manifest for', ep)
          "

      - name: Upload Verified Episode Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ep.outputs.selected_episode }}-verified-package
          path: |
            episodes/${{ steps.ep.outputs.selected_episode }}.html
            episodes/${{ steps.ep.outputs.selected_episode }}.srt
            episodes/${{ steps.ep.outputs.selected_episode }}-chapters.txt
            episodes/${{ steps.ep.outputs.selected_episode }}-scenes.txt
            episodes/${{ steps.ep.outputs.selected_episode }}-manifest.json
          if-no-files-found: error
          retention-days: 30
