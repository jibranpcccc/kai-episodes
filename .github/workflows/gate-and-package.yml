name: Byte Forensics Quality Gate & Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode to validate and package (e.g. BYTE-DUAL-GPU, BYTE-PAYBACK, BYTE-VRAM)"
        required: false
        default: "BYTE-DUAL-GPU"

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: 31-Check Quality Gate & Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify FFmpeg
        run: |
          ffmpeg -version | head -1 || sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install playwright numpy pillow edge-tts -q
          python -m playwright install --with-deps chromium

      - name: Determine Episode to Validate
        id: ep
        run: |
          EP="${{ github.event.inputs.episode }}"
          if [ -z "$EP" ]; then
            EP="BYTE-DUAL-GPU"
          fi
          echo "selected_episode=$EP" >> $GITHUB_OUTPUT

      - name: Run 31-Check Universal Quality Gate (fusion_gate.py)
        run: |
          EP="${{ steps.ep.outputs.selected_episode }}"
          echo "Running Quality Gate on $EP..."
          python -u data/fusion_gate.py "$EP"

      - name: Run Deep Episode Semantic & Fact-Check Auditor
        run: |
          EP="${{ steps.ep.outputs.selected_episode }}"
          echo "Running Deep Episode Auditor on $EP..."
          python -u data/deep_episode_auditor.py "$EP"

      - name: Upload Verified Episode Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ep.outputs.selected_episode }}-verified-package
          path: |
            episodes/${{ steps.ep.outputs.selected_episode }}.html
            episodes/${{ steps.ep.outputs.selected_episode }}.srt
            episodes/${{ steps.ep.outputs.selected_episode }}-chapters.txt
            episodes/${{ steps.ep.outputs.selected_episode }}-scenes.txt
            ${{ steps.ep.outputs.selected_episode }}.html
            ${{ steps.ep.outputs.selected_episode }}.srt
            ${{ steps.ep.outputs.selected_episode }}-chapters.txt
            ${{ steps.ep.outputs.selected_episode }}-scenes.txt
          if-no-files-found: ignore
          retention-days: 30
